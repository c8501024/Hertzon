# Temporary (removed before the PR): fast sweep factorization on a Mac, this branch vs v0.4.8
name: Mac fast sweep bench
on:
  push:
    branches: [claude/project-thread-l8ox9d]
    paths: [".github/workflows/mac-fast-bench.yml", "bench/mac-fast/**", "hertzon/solver/fast_sweep.py"]
env:
  HERTZON_NO_UPDATE_CHECK: "1"
  HERTZON_NO_PRELOAD: "1"
  QT_QPA_PLATFORM: offscreen
jobs:
  full:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [patch025fast, patch01fast]
    steps:
      - uses: actions/checkout@v4
        with: {path: new}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install
        run: |
          for i in 1 2 3; do python -m pip install -q -e new psutil && break; sleep 30; done
      - name: Accelerate and SPARTA
        run: |
          mkdir work && cd work
          python ../new/bench/mac-fast/prep.py "$GITHUB_WORKSPACE/new" proj
          P=proj/${{ matrix.model }}.hzn
          python ../new/bench/mac-fast/run.py acc "$GITHUB_WORKSPACE/new" Accelerate $P | cut -c1-900
          python -m hertzon.solver.sparta_setup install
          python ../new/bench/mac-fast/run.py sparta "$GITHUB_WORKSPACE/new" SPARTA $P | cut -c1-900

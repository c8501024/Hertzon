# Publishes the project website (site/ plus the documentation from docs/*.md, built by site/build.py) to GitHub Pages: https://c8501024.github.io/Hertzon/
# Needs Settings > Pages > Source: "GitHub Actions" once. Screenshots and the splash come from the repo,
# so the site has no copies of its own.
# The branch overview (c8501024/branch-overview-action) is built into /branches/ on every run.
# Besides the triggers below, branch-overview.yml starts this workflow when dev, main or a pull request
# changes, so the overview stays current.
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "CHANGELOG.md", "hertzon/gui/splash.jpg", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # hourly, catches what no event reports (e.g. check results on pull requests)

permissions:
  contents: read
  pull-requests: read
  checks: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site (landing page and docs/*.md as HTML)
        run: |
          pip install markdown
          python site/build.py _site
      - name: Branch overview
        continue-on-error: true   # the website is deployed even if the overview fails
        uses: c8501024/branch-overview-action@v1
        with:
          base: main
          head: dev
          output: _site/branches/index.html
          lang: de
          noindex: "true"
          timezone: Europe/Berlin
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

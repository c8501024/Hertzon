# Temporary: compares the matrix solver of "Auto" on a Mac before and after this branch (removed before the PR)
name: Mac solver bench
on:
  push:
    branches: [claude/project-thread-6wg1n4]
    paths: [".github/workflows/mac-solver-bench.yml", "bench/mac-solver/**"]
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: [microstrip, patch025, patch01, patch025fast, edge, hairpin]
    env:
      HERTZON_NO_UPDATE_CHECK: "1"
      HERTZON_NO_PRELOAD: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with: {path: new}
      - uses: actions/checkout@v4
        with: {path: old, ref: dev}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install
        run: |
          python -m pip install -q -e new psutil
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          python -c "from hertzon.solver import solver_choice as s; print(s.offered(), s.auto_solver())"
      - name: Projects
        run: |
          mkdir work && cd work
          python ../new/bench/mac-solver/prep.py "$GITHUB_WORKSPACE/new" proj
      - name: Before and after, without SPARTA
        run: |
          cd work
          python ../new/bench/mac-solver/run.py old "$GITHUB_WORKSPACE/old" Auto proj/${{ matrix.model }}.hzn
          python ../new/bench/mac-solver/run.py new "$GITHUB_WORKSPACE/new" Auto proj/${{ matrix.model }}.hzn
          python ../new/bench/mac-solver/run.py old2 "$GITHUB_WORKSPACE/old" Auto proj/${{ matrix.model }}.hzn
      - name: Before and after, with SPARTA installed (as install.sh offers on a Mac)
        run: |
          python -m hertzon.solver.sparta_setup install
          cd work
          python ../new/bench/mac-solver/run.py old_sparta "$GITHUB_WORKSPACE/old" Auto proj/${{ matrix.model }}.hzn
          python ../new/bench/mac-solver/run.py new_sparta "$GITHUB_WORKSPACE/new" Auto proj/${{ matrix.model }}.hzn
      - name: Table
        if: always()
        run: |
          cd work
          python ../new/bench/mac-solver/table.py | tee table.md
          cat table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.model }}
          path: |
            work/*.json
            work/*.log
            work/*.s*p
            work/table.md

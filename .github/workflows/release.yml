# Builds the installers (build.yml, with the Windows installation check) and only then attaches both
# to a GitHub release. Runs
#  - when a push to main brings a version in pyproject.toml that has no tag v<version> yet, i.e. when
#    dev is merged into main after the version was raised,
#  - when a version tag (v0.1.0, ...) is pushed,
#  - by hand from the Actions tab (Run workflow).
# The release is named after the version in pyproject.toml (or the pushed tag).
name: Release

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: New version?
        id: check
        run: |
          VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_EVENT_NAME" = push ] \
              && git ls-remote --exit-code --tags origin "refs/tags/v$VER" > /dev/null; then
            echo "v$VER is already released, nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Version
        id: ver
        run: |
          VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          # the section "## <version> ..." up to the next "## " heading
          awk -v v="${{ steps.ver.outputs.ver }}" '
            /^## / { on = (index($0, "## " v " ") == 1 || $0 == "## " v) }
            on && !/^## / { print }' CHANGELOG.md > notes.md
          {
            echo
            echo 'Windows installer (`Hertzon-Setup-*.exe`) and Linux package (`Hertzon-*-linux.tar.gz`).'
            echo
            echo 'The FEM solver core of Hertzon is [EMerge](https://github.com/FennisRobert/EMerge), the open-source'
            echo 'FEM solver by Robert Fennis.'
          } >> notes.md
          cat notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          name: Hertzon ${{ github.ref_type == 'tag' && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            dist/Hertzon-Setup-*.exe
            dist/Hertzon-*-linux.tar.gz

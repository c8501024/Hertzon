[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hertzon"
version = "0.2.8"
description = "3D full-wave FEM simulator with an adaptive-meshing workflow, built on EMerge"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10,<3.14"   # EMerge 3 supports Python 3.10 to 3.13
dependencies = [
    # EMerge at the commit in packaging/emerge-commit, from the wheels .github/workflows/emerge-wheels.yml
    # built for it (release emerge-<short sha>); other platforms build that commit from source (Rust).
    # Brings emsutil (material library) with it.
    "emerge @ https://github.com/c8501024/Hertzon/releases/download/emerge-78a7003/emerge-3.0.0b5.post202610290919-cp310-abi3-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "emerge @ https://github.com/c8501024/Hertzon/releases/download/emerge-78a7003/emerge-3.0.0b5.post202610290919-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "emerge @ git+https://github.com/FennisRobert/EMerge@78a7003c1cc324ab36bcd28a8bdd736cf67b8a56 ; sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine != 'AMD64') or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    # gmsh 4.13 and 4.14 fail on some faces of the showcase example, and after such a failure later meshes of
    # the same session come out empty (4.13 stays locked: "I'm busy! Ask me that later"). EMerge allows 4.13.
    "gmsh>=4.15",
    "numba>=0.60",                # Hertzon's own kernels (curved elements, refinement size field); EMerge 3 no longer needs it
    "PySide6>=6.5",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "matplotlib>=3.7",
    "pillow",                     # GIF export of field animations (also needed by matplotlib)
    "numpy",
    "pymmg>=1.0",                 # mmg3d (LGPL) for the "Mmg" adaptive refinement
    "fast-simplification>=0.1",   # MIT, shape-preserving STL simplification on import
    "hfsynpy>=0.1.3",             # GPL-2.0+, microstrip synthesis of the filter and antenna design tools
]

[project.optional-dependencies]
test = ["pytest", "gerbonara", "pygerber", "pillow"]   # Gerber export is read back with independent parsers

[project.scripts]
hertzon = "hertzon.gui.app:main"
hertzon-mcp = "hertzon.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["hertzon*"]

[tool.setuptools.package-data]
"hertzon.gui" = ["*.ico", "*.png", "*.jpg", "formula/*.html", "formula/*.js", "formula/*.txt", "formula/fonts/*.woff2"]
